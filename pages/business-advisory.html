<!doctype html>
<html lang="ko">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "Noto Sans KR"] } } } };
    </script>
    <link rel="stylesheet" href="../assets/clone.css" />

  <body class="font-sans bg-white text-slate-900">
    <header class="fixed top-0 left-0 right-0 z-50">
      <div class="glass-header">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <a class="flex items-center gap-3" href="../index.html">

            <div class="font-black tracking-tight">개미투자</div>

            <a class="hover:text-sky-600 transition-colors" href="./business-advisory.html">사업영역</a>

      <div class="grid md:grid-cols-4 gap-6">
        <div class="md:col-span-3 border border-slate-200 rounded-2xl p-6 bg-white">
          <div class="grid md:grid-cols-3 gap-6">
            <div class="border border-slate-200 rounded-2xl p-5">
              <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">01</div>
              <div class="text-slate-900 font-black mb-2">시장 데이터 요약</div>
              <div class="text-slate-500 text-sm leading-relaxed">지표·이슈·리스크 포인트를 정리해 제공합니다.</div>

            <div class="border border-slate-200 rounded-2xl p-5">

              <div class="text-slate-900 font-black mb-2">전략 프레임</div>

            </div>
            <div class="border border-slate-200 rounded-2xl p-5">

              <div class="text-slate-900 font-black mb-2">공지 기반 운영</div>
              <div class="text-slate-500 text-sm leading-relaxed">안내/변경 사항을 공지로 고정 관리합니다.</div>
            </div>
          </div>
        </div>
        <aside class="border border-slate-200 rounded-2xl p-6 bg-slate-50">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Quick</div>
          <a class="btn-dark w-full" href="./support-consult.html">
            상담신청
          </a>
          <a class="mt-3 block w-full text-center py-4 bg-white border border-slate-200 text-slate-900 font-bold rounded-xl hover:border-sky-300 hover:text-sky-700 transition-colors" href="./support-notice.html">
            공지사항

        <div class="text-xs text-slate-400">© <span id="year"></span> 개미투자. All Rights Reserved.</div>

      document.getElementById("year").textContent = String(new Date().getFullYear());
