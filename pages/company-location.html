<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오시는 길 | 개미투자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "Noto Sans KR"] } } } };
    </script>
    <link rel="stylesheet" href="../assets/clone.css" />
  </head>
  <body class="font-sans bg-white text-slate-900">
    <header class="fixed top-0 left-0 right-0 z-50">
      <div class="glass-header">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <a class="flex items-center gap-3" href="../index.html">
            <div class="logo-badge">G</div>
            <div class="font-black tracking-tight">개미투자</div>
          </a>
          <nav class="hidden md:flex items-center gap-6 text-sm font-bold">
            <a class="hover:text-sky-600 transition-colors" href="../index.html">홈</a>
            <a class="hover:text-sky-600 transition-colors" href="./company-overview.html">회사소개</a>
            <a class="hover:text-sky-600 transition-colors" href="./business-advisory.html">사업영역</a>
            <a class="hover:text-sky-600 transition-colors" href="./support-notice.html">고객지원</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-5 pt-28 pb-16">
      <div class="mb-10">
        <div class="text-sky-600 font-bold text-sm tracking-widest uppercase mb-2">Company</div>
        <h1 class="text-3xl font-black">오시는 길</h1>
        <p class="text-slate-500 mt-2">주소 및 위치 정보는 개인정보/식별정보를 제외하고 표시합니다.</p>
      </div>

      <div class="grid md:grid-cols-3 gap-6">
        <div class="md:col-span-2 border border-slate-200 rounded-2xl p-6 bg-white">
          <div class="grid sm:grid-cols-2 gap-6">
            <div>
              <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Address</div>
              <div class="text-slate-900 font-black">0000</div>
              <div class="text-slate-500 text-sm mt-2">지하철/버스 안내 등은 추후 추가 가능합니다.</div>
            </div>
            <div>
              <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Contact</div>
              <div class="text-slate-900 font-black">0000-0000-0000</div>
              <div class="text-slate-500 text-sm mt-2">평일 09:00 - 18:00 (주말/공휴일 휴무)</div>
            </div>
          </div>
        </div>
        <aside class="border border-slate-200 rounded-2xl p-6 bg-slate-50">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Map</div>
          <div class="text-sm text-slate-700 leading-relaxed">
            정적 사이트 기준으로는<br />
            카카오/네이버 지도 링크 연결을 권장합니다.
          </div>
        </aside>
      </div>
    </main>

    <footer class="bg-slate-50 border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-5 py-10">
        <div class="text-xs text-slate-400">© <span id="year"></span> 개미투자. All Rights Reserved.</div>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
