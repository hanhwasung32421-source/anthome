<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>1:1 상담신청 | 개미투자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "Noto Sans KR"] } } } };
    </script>
    <link rel="stylesheet" href="../assets/clone.css" />
  </head>
  <body class="font-sans bg-white text-slate-900">
    <header class="fixed top-0 left-0 right-0 z-50">
      <div class="glass-header">
        <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
          <a class="flex items-center gap-3" href="../index.html">
            <div class="logo-badge">G</div>
            <div class="font-black tracking-tight">개미투자</div>
          </a>
          <nav class="hidden md:flex items-center gap-6 text-sm font-bold">
            <a class="hover:text-sky-600 transition-colors" href="../index.html">홈</a>
            <a class="hover:text-sky-600 transition-colors" href="./company-overview.html">회사소개</a>
            <a class="hover:text-sky-600 transition-colors" href="./business-advisory.html">사업영역</a>
            <a class="hover:text-sky-600 transition-colors" href="./support-notice.html">고객지원</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-5 pt-28 pb-16">
      <div class="mb-10">
        <div class="text-sky-600 font-bold text-sm tracking-widest uppercase mb-2">Support</div>
        <h1 class="text-3xl font-black">1:1 상담신청</h1>
        <p class="text-slate-500 mt-2">
          정적 사이트 기준 샘플 폼입니다. 실제 운영은 구글폼/타입폼/백엔드(API) 연동 중 하나로 연결하면 됩니다.
        </p>
      </div>

      <div class="border border-slate-200 rounded-2xl p-6 bg-white">
        <form onsubmit="return false;" class="space-y-4">
          <div class="grid sm:grid-cols-2 gap-4">
            <label class="block">
              <div class="text-sm font-bold text-slate-700 mb-2">이름</div>
              <input
                class="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-sky-200"
                placeholder="홍길동"
              />
            </label>
            <label class="block">
              <div class="text-sm font-bold text-slate-700 mb-2">연락처</div>
              <input
                class="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-sky-200"
                placeholder="010-0000-0000"
              />
            </label>
          </div>

          <label class="block">
            <div class="text-sm font-bold text-slate-700 mb-2">상담 내용</div>
            <textarea
              rows="6"
              class="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-sky-200"
              placeholder="상담 요청 내용을 입력하세요."
            ></textarea>
          </label>

          <div class="pt-2 flex flex-col sm:flex-row gap-3">
            <button
              type="button"
              class="btn-primary w-full sm:w-auto"
              onclick="alert('샘플 폼입니다. 실제 전송은 연동이 필요합니다.');"
            >
              상담 신청(샘플)
            </button>
            <a class="btn-dark w-full sm:w-auto" href="./support-notice.html">
              공지사항 보기
            </a>
          </div>

          <div class="text-xs text-slate-400 pt-2">
            개인정보/식별정보는 0000으로 마스킹 처리합니다. 실제 전송은 외부 폼 또는 API 연동이 필요합니다.
          </div>
        </form>
      </div>
    </main>

    <footer class="bg-slate-50 border-t border-slate-200">
      <div class="max-w-6xl mx-auto px-5 py-10">
        <div class="text-xs text-slate-400">© <span id="year"></span> 개미투자. All Rights Reserved.</div>
      </div>
    </footer>
    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
    </script>
  </body>
</html>
